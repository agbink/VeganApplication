spring.application.name=vegan-api

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vegan_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=never

server.port=${SERVER_PORT:8080}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when_authorized

jwt.secret=${JWT_SECRET}
google.client-id=${GOOGLE_CLIENT_ID}
app.admin-email=${ADMIN_EMAIL:}

file.upload-dir=${UPLOAD_DIR:./uploads}
file.base-url=${FILE_BASE_URL:http://localhost:8080}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
