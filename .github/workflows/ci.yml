name: Build and test

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/monorepo-consolidation]

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run backend tests
        # Includes MySQL Testcontainers integration tests.
        run: chmod +x gradlew && ./gradlew test

  android-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run Android unit tests
        run: chmod +x gradlew && ./gradlew testDebugUnitTest
