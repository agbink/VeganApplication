name: Build and test

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/monorepo-consolidation]

permissions:
  contents: read

jobs:
  test-selector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify changed-file test selection
        run: python -m unittest discover -s scripts/tests -v

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run backend tests
        # Includes MySQL Testcontainers integration tests.
        run: chmod +x gradlew && ./gradlew test

  backend-concurrency-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify resolved Testcontainers version
        run: bash gradlew dependencyInsight --dependency org.testcontainers:testcontainers --configuration testRuntimeClasspath
      - name: Run backend concurrency correctness tests
        # MySQL and Redis Testcontainers; performance measurements remain opt-in.
        run: chmod +x gradlew && ./gradlew concurrencyTest
      - name: Upload concurrency test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-concurrency-test-reports
          path: |
            backend/build/reports/tests/concurrencyTest/
            backend/build/test-results/concurrencyTest/
          if-no-files-found: warn

  android-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run Android unit tests
        run: chmod +x gradlew && ./gradlew testDebugUnitTest
